<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DH logo</title>
  <desc id="desc">A navy circular logo with white DH initials.</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#0d315b"/>
      <stop offset="55%" stop-color="#061a34"/>
      <stop offset="100%" stop-color="#020817"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="238" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#ffffff" stroke-width="18"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8"/>
  <text x="256" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="166" font-weight="900" letter-spacing="-16" fill="#ffffff">DH</text>
</svg>
